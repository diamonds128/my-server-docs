# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]      # 监听 main 分支的推送
  workflow_dispatch:       # 允许手动触发（解决分支保护问题）

# 设置部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，避免冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # commit message 含 [skip ci] 时跳过构建（含手动触发——手动触发无 head_commit，
    # 表达式里兜底成空串，不会报错，等价于正常构建）
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 拉取所有历史记录，确保 lastUpdated 能获取每个页面的独立提交时间

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22            # 使用 Node 22（当前 LTS）
          cache: npm

      - name: Install dependencies
        run: npm ci                   # 使用 package-lock.json 快速安装

      - name: Build project
        run: npm run build            # Astro 构建到 dist/

      # GitHub Pages 对未知扩展名（raw 路由输出的无扩展名文件）一律按
      # application/octet-stream 下发，浏览器会直接下载而不是显示。
      # Pages 不支持自定义响应头，所以这里给 raw 产物补一个 .md：
      # Jekyll 会把 .md 当 Markdown，但本站产物不含 .nojekyll，
      # Pages 对普通文本类扩展名返回 text/markdown，浏览器即内联显示。
      - name: Add .md extension to raw source files
        run: |
          for f in dist/raw/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.md|*.html) ;;
              *) cp "$f" "$f.md" ;;
            esac
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist                  # 上传构建产物

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4   # 正式部署