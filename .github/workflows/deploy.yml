# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]      # 监听 main 分支的推送
  workflow_dispatch:       # 允许手动触发（解决分支保护问题）

# 设置部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，避免冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # commit message 含 [skip ci] 时跳过构建（含手动触发——手动触发无 head_commit，
    # 表达式里兜底成空串，不会报错，等价于正常构建）
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 拉取所有历史记录，确保 lastUpdated 能获取每个页面的独立提交时间

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22            # 使用 Node 22（当前 LTS）
          cache: npm

      - name: Install dependencies
        run: npm ci                   # 使用 package-lock.json 快速安装

      - name: Build project
        run: npm run build            # Astro 构建到 dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist                  # 上传构建产物

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4   # 正式部署